</script>
<style>
  :root{
    --ink:#163A57;
    --ink-soft:#5C7C93;
    --paper:#EAF6FD;
    --card:#FFFFFF;
    --line:#D3E7F5;
    --blue:#2E9BE0;
    --blue-deep:#1C7EC0;
    --amber:#E7A83D;
    --amber-deep:#BD7F22;
    --green:#2FA97C;
    --green-deep:#1F7D5A;
    --red:#E15252;
    --radius:16px;
    --radius-sm:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  #app{max-width:640px;margin:0 auto;min-height:100vh;}

  header{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top);}
  .top-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;gap:10px;}
  .top-row h1{font-size:15.5px;margin:0;font-weight:700;letter-spacing:-0.01em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .icon-btn{border:none;background:var(--blue);color:#fff;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;position:relative;}
  .icon-btn:active{background:var(--blue-deep);}
  .icon-btn.ready{background:var(--green);}
  .icon-btn.ready:active{background:var(--green-deep);}
  .icon-btn.building{background:var(--ink-soft);cursor:default;}
  .icon-btn .spinner{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:iconspin .7s linear infinite;}
  @keyframes iconspin{to{transform:rotate(360deg);}}
  .list-row-actions button.ready{color:var(--green-deep);border-color:var(--green);}
  .list-row-actions button.building{color:var(--ink-soft);cursor:default;}
  .list-row-actions .spinner-sm{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--ink-soft);animation:iconspin .7s linear infinite;}
  .menu-btn{border:none;background:none;color:var(--ink);cursor:pointer;padding:4px 6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .save-indicator{font-size:11px;color:var(--ink-soft);padding:0 14px 8px;}
  .save-indicator-error{font-size:13px;font-weight:700;color:#fff;background:var(--red);padding:8px 14px;}

function fmtDateTime(ts){
  const d = new Date(ts);
  const dd = String(d.getDate()).padStart(2,"0");
  const mm = String(d.getMonth()+1).padStart(2,"0");
  const hh = String(d.getHours()).padStart(2,"0");

/* ---------- Speicherung: mehrere Datensätze (Entwürfe / Fertig) ---------- */
/* IndexedDB statt localStorage: localStorage ist auf iOS auf wenige MB begrenzt
   und reicht bei mehreren hochauflösenden Fotos schnell nicht mehr aus — ein
   fehlgeschlagenes Speichern blieb dann unbemerkt, bis die Seite neu geladen
   wurde und den letzten *erfolgreich* gespeicherten (älteren) Stand zeigte.
   IndexedDB hat ein vielfaches an Speicherplatz und behebt das Problem an der Wurzel. */
const RECORDS_KEY = "vorortcheck_records_v1";
const IDB_NAME = "vorortcheck_db";
const IDB_STORE = "kv";
let records = [];
let currentRecordId = null;
let screen = "home"; // 'home' | 'form' | 'drafts' | 'fertig'
let storageOK = true;
const pdfCache = {}; // id -> { status: 'building'|'ready'|'error', blob, filename }
let saveTimer = null;
let lastSavedAt = null;

let idbOpenPromise = null;
function openDB(){
  if(idbOpenPromise) return idbOpenPromise;
  idbOpenPromise = new Promise((resolve, reject)=>{
    if(!window.indexedDB){ reject(new Error("IndexedDB nicht verfügbar")); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
  return idbOpenPromise;
}
function idbGet(key){
  return openDB().then(db => new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, "readonly");
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  }));
}
function idbSet(key, value){
  return openDB().then(db => new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).put(value, key);
    tx.oncomplete = ()=> resolve();
    tx.onerror = ()=> reject(tx.error);
  }));
}
async function loadRecords(){
  try{
    const fromIDB = await idbGet(RECORDS_KEY);
    if(fromIDB) return fromIDB;
  }catch(e){ console.warn("IndexedDB-Lesefehler", e); }
  // Einmalige Übernahme von Datensätzen aus einer älteren Version (localStorage).
  try{
    const legacy = JSON.parse(localStorage.getItem(RECORDS_KEY) || "[]");
    if(legacy.length){ try{ await idbSet(RECORDS_KEY, legacy); }catch(e){} }
    return legacy;
  }catch(e){ return []; }
}
async function saveRecords(){
  try{
    await idbSet(RECORDS_KEY, records);
    lastSavedAt = Date.now();
    storageOK = true;
  }catch(e){
    console.error("Speichern fehlgeschlagen", e);
    storageOK = false;
  }
  updateSaveIndicator();
}
function scheduleAutosave(){
  delete pdfCache["current"];
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveCurrentRecord, 700);
}
async function saveCurrentRecord(){
  if(!currentRecordId) return;
  const rec = records.find(r=>r.id===currentRecordId);
  if(rec){ rec.updatedAt = Date.now(); }
  await saveRecords();
}
function flushPendingSave(){
  if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; saveCurrentRecord(); }
}
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState === "hidden") flushPendingSave(); });
window.addEventListener("pagehide", flushPendingSave);
if(navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(()=>{}); }
function updateSaveIndicator(){
  const el = document.getElementById("saveIndicator");
  if(!el) return;
  if(!storageOK){
    el.textContent = "⚠ Speichern fehlgeschlagen — App geöffnet lassen und nicht schließen, bis das Problem behoben ist!";
    el.classList.add("save-indicator-error");
    return;
  }
  el.classList.remove("save-indicator-error");
  el.textContent = lastSavedAt ? `Gespeichert um ${new Date(lastSavedAt).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})}` : "";
}

/* ---------- Path helpers ---------- */
function getPath(obj, path){
  return path.split(".").reduce((o,k)=> (o==null? undefined : o[k]), obj);
}
function setPath(obj, path, value){
  const keys = path.split(".");
  let o = obj;
  for(let i=0;i<keys.length-1;i++){ o = o[keys[i]]; }
  o[keys[keys.length-1]] = value;
}
function domId(path){ return "fld-" + path.replace(/\./g,"-"); }

const DWB_LOGO_RATIO = 333/640;

let menuOpen = false;

/* ---------- Navigation ---------- */
function startNewRecord(){
  delete pdfCache["current"];
  S = freshState();
  const rec = { id:S.meta.id, status:"draft", updatedAt:Date.now(), data:S };
  records.unshift(rec);
  currentRecordId = S.meta.id;
  screen = "form";
  saveRecords();
  render();
}
function openRecord(id){
  const rec = records.find(r=>r.id===id);
  if(!rec) return;
  delete pdfCache["current"];
  S = rec.data;
  currentRecordId = id;
  screen = "form";
  render();
}
function goHome(){
  clearTimeout(saveTimer);
  saveCurrentRecord();
  S = null; currentRecordId = null; screen = "home";
  render();
}
function goScreen(s){ screen = s; render(); }
function showConfirm(message, onConfirm){
  const old = document.getElementById("confirmOverlay");
  if(old) old.remove();
  const overlay = document.createElement("div");
  overlay.id = "confirmOverlay";
  overlay.style.cssText = "position:fixed;inset:0;background:rgba(22,58,87,.5);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;";
  overlay.innerHTML = `
    <div style="background:var(--card);border-radius:var(--radius);padding:22px;max-width:340px;width:100%;">
      <div style="font-size:14.5px;color:var(--ink);margin-bottom:18px;line-height:1.4;">${message}</div>
      <div style="display:flex;gap:10px;">
        <button id="confirmCancelBtn" style="flex:1;padding:11px;border-radius:var(--radius-sm);border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:700;font-size:14px;cursor:pointer;">Abbrechen</button>
        <button id="confirmOkBtn" style="flex:1;padding:11px;border-radius:var(--radius-sm);border:1px solid var(--red);background:var(--red);color:#fff;font-weight:700;font-size:14px;cursor:pointer;">Löschen</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById("confirmCancelBtn").onclick = ()=> overlay.remove();
  document.getElementById("confirmOkBtn").onclick = ()=>{ overlay.remove(); onConfirm(); };
}
function deleteRecord(id){
  showConfirm("Diese Bestandsaufnahme wirklich löschen?", ()=>{
    records = records.filter(r=>r.id!==id);
    saveRecords();
    if(currentRecordId===id){ S=null; currentRecordId=null; screen="home"; }
    render();
  });
}
function menuDeleteCurrent(){
  if(!currentRecordId) return;
  showConfirm("Diese Bestandsaufnahme wirklich löschen?", ()=>{
    records = records.filter(r=>r.id!==currentRecordId);
    saveRecords();
    S=null; currentRecordId=null; screen="home"; menuOpen=false;
    render();
  });
}
/* PDF-Erstellung (langsam, Foto-Uploads) und Teilen (muss eine direkte,
   frische Nutzer-Geste sein) sind bewusst getrennt: iOS erlaubt
   navigator.share() nur, wenn es ohne nennenswerte Wartezeit nach einem
   Tap aufgerufen wird. Wartet man erst das langsame PDF-Bauen ab und ruft
   share() danach auf, lehnt iOS es stillschweigend ab und die App fällt
   auf einen blob:-Link zurück, der beim Teilen den echten Nutzernamen
   (github.io-Domain) offenlegt. Deshalb: zuerst bauen (preparePDF),
   erst bei einem zweiten, echten Tap teilen (sharePDF). */
async function preparePDF(id, data){
  if(pdfCache[id] && (pdfCache[id].status === "building" || pdfCache[id].status === "ready")) return;
  pdfCache[id] = { status: "building" };
  render();
  const doc = await buildPDFSafe(data);
  if(!doc){ delete pdfCache[id]; render(); return; }
  pdfCache[id] = { status: "ready", blob: doc.output("blob"), filename: pdfFilename(data) };
  render();
}
function sharePDF(id){
  const entry = pdfCache[id];
  if(!entry || entry.status !== "ready") return;
  triggerDownload(entry.blob, entry.filename);
}
function menuDownloadPDF(){
  preparePDF("current", S);
}
async function quickPDF(id){
  const rec = records.find(r=>r.id===id);
  if(!rec) return;
  const entry = pdfCache[id];
  if(entry && entry.status === "ready"){ sharePDF(id); }
  else { await preparePDF(id, rec.data); }
}

/* ---------- Master render ---------- */
function render(){
  const scrollY = window.scrollY;
  const app = document.getElementById("app");

  if(screen === "form" && S){
    app.innerHTML = renderFormScreen();
    document.getElementById("mainContent").innerHTML = renderAllSections();
  }else if(screen === "drafts"){
    app.innerHTML = renderList("draft");
  }else if(screen === "fertig"){
    app.innerHTML = renderList("fertig");
  }else{
    app.innerHTML = renderHome();
  }
  updateSaveIndicator();
  window.scrollTo(0, scrollY);
}
function toggleMenu(e){ e.stopPropagation(); menuOpen = !menuOpen; render(); }
document.addEventListener("click", ()=>{ if(menuOpen){ menuOpen=false; render(); } });

function renderFormScreen(){
  const title = [S.kunde.vorname, S.kunde.nachname].filter(Boolean).join(" ") || "Neuer Vor-Ort-Check";
  return `
    <header>
      <div class="top-row">
        <button class="menu-btn" onclick="goHome()" title="Zur Startseite">${icon("arrowLeft")}</button>
        <h1>${escapeHtml(title)}</h1>
        ${(()=>{
          const entry = pdfCache["current"];
          if(entry && entry.status==="building") return `<button class="icon-btn building" title="PDF wird erstellt…" disabled><span class="spinner"></span></button>`;

/* ---------- Field builders ---------- */
function textField(label, path, opts={}){
  const val = getPath(S, path) ?? "";
  const type = opts.type || "text";
  return `
    <div class="field" id="${domId(path)}">
      <label class="field-label">${label}${opts.required?' <span class="req">*</span>':""}</label>
      <input type="${type}" value="${escapeAttr(val)}" placeholder="${opts.placeholder||""}"
        oninput="setPath(S,'${path}', this.value); scheduleAutosave();">
    </div>`;
}
function textareaField(label, path, opts={}){
  const val = getPath(S, path) ?? "";
  return `
    <div class="field" id="${domId(path)}">
      <label class="field-label">${label}${opts.required?' <span class="req">*</span>':""}</label>
      <textarea oninput="setPath(S,'${path}', this.value); scheduleAutosave();">${escapeHtml(val)}</textarea>
    </div>`;
}
function radioField(label, path, options, opts={}){
  const val = getPath(S, path) ?? "";
  return `
    <div class="field" id="${domId(path)}">
      <label class="field-label">${label}${opts.required?' <span class="req">*</span>':""}</label>
      <div class="radio-list">
        ${options.map(o=>`
          <label class="radio-row ${val===o?"checked":""}">
            <input type="radio" name="${path}" ${val===o?"checked":""} onchange="setPath(S,'${path}','${escapeAttr(o)}'); scheduleAutosave(); render();">
            <span>${o}</span>
          </label>`).join("")}
      </div>
    </div>`;
}
function checkField(label, path){
  const val = !!getPath(S, path);
  return `
    <div class="check-row" style="margin:10px 0;">
      <input type="checkbox" ${val?"checked":""} onchange="setPath(S,'${path}', this.checked); scheduleAutosave(); render();">
      <span>${label}</span>
    </div>`;
}
function kwhField(label, path){
  const val = getPath(S, path) ?? "";
  return `
    <div class="field" id="${domId(path)}">
      <label class="field-label">${label}</label>
      <input type="number" value="${escapeAttr(val)}" placeholder="0"
        oninput="setPath(S,'${path}', this.value); scheduleAutosave(); updateVerbrauchTotal();">
    </div>`;
}
function verbrauchTotal(){
  const g = S.elektro.grossverbraucher;
  return [S.elektro.stromverbrauch, g.waermepumpe, g.eauto, g.sauna, g.pool]
    .map(v=>parseFloat(v)||0).reduce((a,b)=>a+b,0);
}
function updateVerbrauchTotal(){
  const el = document.getElementById("verbrauchTotalValue");
  if(el) el.textContent = verbrauchTotal().toLocaleString("de-DE") + " kWh/Jahr";
}
function photoSlot(path, label, required, noSketch){
  const val = getPath(S, path);
  if(val){
    return `
    <div class="field" id="${domId(path)}">
      <label class="field-label">${label}${required?' <span class="req">*</span>':""}</label>
      <div class="photo-preview">
        <img src="${val}" alt="${label}">
        <button type="button" class="photo-remove" onclick="setPath(S,'${path}',null); scheduleAutosave(); render();">Entfernen</button>
      </div>
      ${noSketch ? "" : `
      <div class="sketch-actions">
        <button onclick="openSketchModal('${path}','${escapeAttr(label)}')">${icon("edit",16)} Auf Foto einzeichnen</button>
      </div>`}
    </div>`;
  }
  return `
    <div class="field" id="${domId(path)}">
      <label class="field-label">${label}${required?' <span class="req">*</span>':""}</label>
      <div class="photo-slot">
        <label class="photo-btn">
          <input type="file" accept="image/*" capture="environment" onchange="handlePhoto(event,'${path}')" hidden>
          <span class="icon">${icon("camera")}</span><span>Aufnehmen</span>
        </label>
        <label class="photo-btn">
          <input type="file" accept="image/*" onchange="handlePhoto(event,'${path}')" hidden>
          <span class="icon">${icon("image")}</span><span>Aus Galerie</span>
        </label>
      </div>
    </div>`;
}
function handlePhoto(evt, path){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    setPath(S, path, e.target.result);
    clearTimeout(saveTimer);
    saveCurrentRecord();
    render();
  };
  reader.readAsDataURL(file);
}
function photoAnnotateField(path, label, required){
  return photoSlot(path, label, required);
}
function escapeAttr(s){ return String(s).replace(/"/g,"&quot;"); }
function escapeHtml(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

let sketchCtx=null, sketchMode="pen", drawing=false;
let sketchTargetPath="elektro.skizze";
let sketchStrokes=[], sketchObjects=[], sketchActions=[], sketchCurrentStroke=null;
let sketchObjIdSeq=0, sketchBgImg=null, sketchW=0, sketchH=0;

const SKETCH_MARKER_PATHS = ["elektro.fotoWechselrichter","elektro.fotoSpeicher"];
function openSketchModal(path, label){
  sketchTargetPath = path || "elektro.skizze";
  sketchStrokes = []; sketchObjects = []; sketchActions = []; sketchCurrentStroke = null; sketchBgImg = null;
  const showMarkers = SKETCH_MARKER_PATHS.indexOf(sketchTargetPath) !== -1;
  const modal = document.createElement("div");
  modal.className = "sketch-modal";
  modal.id = "sketchModal";
  modal.innerHTML = `

    <div class="sketch-hint">${showMarkers ? `Tippe "Speicher setzen" / "Wechselrichter setzen" und dann auf die Fläche. Marker lassen sich anschließend verschieben (ziehen) und am Eckpunkt vergrößern/verkleinern. Mit "Stift" frei zeichnen.` : `Mit dem Stift kannst du direkt auf dem Foto zeichnen, z.B. um eine Stelle zu markieren.`}</div>
    <div class="sketch-canvas-wrap">
      <canvas id="sketchCanvas"></canvas>
      <div class="sketch-obj-layer" id="sketchObjLayer"></div>
    </div>
    <div class="sketch-toolbar">
      <button class="tool-btn active" data-tool="pen" onclick="setSketchTool('pen', event)">${icon("edit",16)} Stift</button>
      ${showMarkers ? `
      <button class="tool-btn" data-tool="speicher" onclick="setSketchTool('speicher', event)">${icon("battery",16)} Speicher setzen</button>
      <button class="tool-btn" data-tool="wechselrichter" onclick="setSketchTool('wechselrichter', event)">${icon("zap",16)} Wechselrichter setzen</button>` : ""}
      <button class="tool-btn" onclick="sketchUndo()">${icon("undo",16)} Rückgängig</button>
    </div>
    <div class="sketch-footer">
      <button onclick="closeSketchModal()">Abbrechen</button>
      <button class="save" onclick="saveSketch()">Übernehmen</button>
    </div>
  `;
  document.body.appendChild(modal);

  const canvas = document.getElementById("sketchCanvas");
  const wrap = canvas.parentElement;
  const dpr = window.devicePixelRatio || 1;
  sketchW = wrap.clientWidth; sketchH = wrap.clientHeight;
  canvas.width = sketchW*dpr; canvas.height = sketchH*dpr;
  canvas.style.width = sketchW+"px"; canvas.style.height = sketchH+"px";
  sketchCtx = canvas.getContext("2d");
  sketchCtx.scale(dpr,dpr);

  const bg = getPath(S, sketchTargetPath);
  redrawBase();
  if(bg){
    const img = new Image();
    img.onload = ()=>{ sketchBgImg = img; redrawBase(); };
    img.src = bg;
  }

  canvas.addEventListener("pointerdown", sketchPointerDown);
  canvas.addEventListener("pointermove", sketchPointerMove);
  window.addEventListener("pointerup", sketchPointerUp);
  sketchMode = "pen";
}
function closeSketchModal(){
  const modal = document.getElementById("sketchModal");
  if(modal) modal.remove();
  sketchCtx = null;
}
function setSketchTool(tool, evt){
  sketchMode = tool;
  document.querySelectorAll(".tool-btn[data-tool]").forEach(b=>b.classList.remove("active"));
  if(evt && evt.currentTarget) evt.currentTarget.classList.add("active");
}
function redrawBase(){
  if(!sketchCtx) return;
  sketchCtx.fillStyle = "#ffffff";
  sketchCtx.fillRect(0,0,sketchW,sketchH);
  if(sketchBgImg){ sketchCtx.drawImage(sketchBgImg,0,0,sketchW,sketchH); }
  sketchStrokes.forEach(s=>{
    sketchCtx.strokeStyle = s.color; sketchCtx.lineWidth = s.width;
    sketchCtx.lineJoin = "round"; sketchCtx.lineCap = "round";
    sketchCtx.beginPath();
    s.points.forEach((p,idx)=>{ idx===0 ? sketchCtx.moveTo(p.x,p.y) : sketchCtx.lineTo(p.x,p.y); });
    sketchCtx.stroke();
  });
}
function sketchPointerDown(e){
  if(!sketchCtx) return;
  const rect = e.target.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  if(sketchMode === "speicher" || sketchMode === "wechselrichter"){
    addSketchObject(x,y,sketchMode);
    return;
  }
  drawing = true;
  sketchCurrentStroke = { points:[{x,y}], color:"#2FA97C", width:3.5 };
}
function sketchPointerMove(e){
  if(!drawing || !sketchCtx || sketchMode !== "pen" || !sketchCurrentStroke) return;
  const rect = e.target.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  const pts = sketchCurrentStroke.points;
  const last = pts[pts.length-1];
  sketchCtx.strokeStyle = sketchCurrentStroke.color; sketchCtx.lineWidth = sketchCurrentStroke.width;
  sketchCtx.lineJoin = "round"; sketchCtx.lineCap = "round";
  sketchCtx.beginPath();
  sketchCtx.moveTo(last.x,last.y);
  sketchCtx.lineTo(x,y);
  sketchCtx.stroke();
  pts.push({x,y});
}
function sketchPointerUp(){
  if(drawing && sketchCurrentStroke && sketchCurrentStroke.points.length>1){
    sketchStrokes.push(sketchCurrentStroke);
    sketchActions.push({type:"stroke"});
  }
  drawing = false; sketchCurrentStroke = null;
}
function sketchUndo(){
  const last = sketchActions.pop();
  if(!last) return;
  if(last.type === "stroke"){
    sketchStrokes.pop();
    redrawBase();
  }else if(last.type === "object"){
    sketchObjects = sketchObjects.filter(o=>o.id !== last.id);
    renderSketchObjects();
  }
}
function addSketchObject(x,y,type){
  const w = type==="speicher" ? 90 : 70, h = type==="speicher" ? 50 : 46;
  const obj = { id: ++sketchObjIdSeq, type, x:x-w/2, y:y-h/2, w, h };
  sketchObjects.push(obj);
  sketchActions.push({type:"object", id:obj.id});
  renderSketchObjects();
}
function renderSketchObjects(){
  const layer = document.getElementById("sketchObjLayer");
  if(!layer) return;
  layer.innerHTML = "";
  sketchObjects.forEach(obj=>{
    const div = document.createElement("div");
    div.className = "sketch-obj";
    div.style.left = obj.x+"px"; div.style.top = obj.y+"px";
    div.style.width = obj.w+"px"; div.style.height = obj.h+"px";
    div.style.background = obj.type==="speicher" ? "#2FA97C" : "#BD7F22";
    div.textContent = obj.type==="speicher" ? "Speicher" : "WR";
    const handle = document.createElement("div");
    handle.className = "resize-handle";
    div.appendChild(handle);
    layer.appendChild(div);
    makeObjDraggable(div, obj);
    makeObjResizable(handle, obj, div);
  });
}
function makeObjDraggable(div, obj){
  div.addEventListener("pointerdown", (e)=>{
    if(e.target.classList.contains("resize-handle")) return;
    e.stopPropagation();
    const startX=e.clientX, startY=e.clientY, ox=obj.x, oy=obj.y;
    function move(ev){
      obj.x = ox + (ev.clientX-startX);
      obj.y = oy + (ev.clientY-startY);
      div.style.left = obj.x+"px"; div.style.top = obj.y+"px";
    }
    function up(){ window.removeEventListener("pointermove",move); window.removeEventListener("pointerup",up); }
    window.addEventListener("pointermove",move);
    window.addEventListener("pointerup",up);
  });
}
function makeObjResizable(handle, obj, div){
  handle.addEventListener("pointerdown", (e)=>{
    e.stopPropagation();
    const startX=e.clientX, startY=e.clientY, ow=obj.w, oh=obj.h;
    function move(ev){
      obj.w = Math.max(30, ow + (ev.clientX-startX));
      obj.h = Math.max(24, oh + (ev.clientY-startY));
      div.style.width = obj.w+"px"; div.style.height = obj.h+"px";
    }
    function up(){ window.removeEventListener("pointermove",move); window.removeEventListener("pointerup",up); }
    window.addEventListener("pointermove",move);
    window.addEventListener("pointerup",up);
  });
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function saveSketch(){
  redrawBase();
  sketchObjects.forEach(obj=>{
    const color = obj.type==="speicher" ? "#2FA97C" : "#BD7F22";
    sketchCtx.fillStyle = color; sketchCtx.strokeStyle = "#163A57"; sketchCtx.lineWidth = 1.5;
    roundRect(sketchCtx, obj.x, obj.y, obj.w, obj.h, 5);
    sketchCtx.fill(); sketchCtx.stroke();
    sketchCtx.fillStyle = "#ffffff";
    sketchCtx.font = "600 12px -apple-system, Arial, sans-serif";
    sketchCtx.textAlign = "center"; sketchCtx.textBaseline = "middle";
    sketchCtx.fillText(obj.type==="speicher" ? "Speicher" : "WR", obj.x+obj.w/2, obj.y+obj.h/2);

async function sha256Hex(str){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
async function uploadPhotoForLink(dataUrl){
  if(!supabaseClient) return null;

  function fillCol(c){ doc.setFillColor(c[0],c[1],c[2]); }
  function drawCol(c){ doc.setDrawColor(c[0],c[1],c[2]); }

  function slimHeader(){
    doc.setFontSize(8.5); doc.setFont(undefined,"normal"); col(PDF_INK_SOFT);
    doc.text("Bestandsaufnahme Protokoll · DWB-Energie", marginX, 11);
    doc.text(custName || "", pageW-marginX, 11, {align:"right"});
    drawCol(PDF_LINE); doc.setLineWidth(0.25);
    doc.line(marginX, 14, pageW-marginX, 14);
  }
  function startNewPage(){ doc.addPage(); slimHeader(); y = 22; }
  function checkSpace(h){ if(y + h > pageH - bottomMargin) startNewPage(); }

  let kvIndex = 0;
  function sectionHeader(title, color){
    checkSpace(15);
    kvIndex = 0;
    fillCol(color || PDF_BLUE_DEEP); doc.roundedRect(marginX, y, 3.2, 7, 0.9, 0.9, "F");
    doc.setFontSize(11.5); doc.setFont(undefined,"bold"); col(PDF_INK);
    doc.text(title, marginX+7, y+5.3);
    y += 10;
    drawCol(PDF_LINE); doc.setLineWidth(0.3);
    doc.line(marginX, y, marginX+contentW, y);
    y += 6;
    col(PDF_INK);
  }
  const labelW = 54;
  function kv(label, value){
    if(!value) return;
    doc.setFontSize(9.5);
    const lines = doc.splitTextToSize(String(value), contentW - labelW);
    const rowH = Math.max(lines.length*4.4, 5.2);
    checkSpace(rowH+1.5);
    if(kvIndex % 2 === 1){
      fillCol(PDF_PAPER);
      doc.rect(marginX-2, y-1, contentW+4, rowH+2, "F");
    }
    kvIndex++;
    doc.setFont(undefined,"bold"); col(PDF_INK_SOFT);
    doc.text(label, marginX, y+3.6);
    doc.setFont(undefined,"normal"); col(PDF_INK);
    doc.text(lines, marginX+labelW, y+3.6);
    y += rowH + 1.6;
  }
  function totalRow(label, value){
    if(!value) return;
    checkSpace(10);
    fillCol(PDF_PAPER); doc.roundedRect(marginX-2, y-1, contentW+4, 8.5, 1.5, 1.5, "F");
    drawCol(PDF_BLUE); doc.setLineWidth(0.4); doc.roundedRect(marginX-2, y-1, contentW+4, 8.5, 1.5, 1.5, "S");
    doc.setFontSize(9.5); doc.setFont(undefined,"bold"); col(PDF_INK_SOFT);
    doc.text(label, marginX+2, y+4.8);
    doc.setFontSize(10.5); col(PDF_BLUE_DEEP);
    doc.text(String(value), marginX+labelW, y+4.8);
    y += 11;
    kvIndex = 0;
  }
  /* Reserviert vorab den Platz für eine ganze Gruppe zusammengehöriger
     kv-Zeilen, damit ein Seitenumbruch nicht mitten in der Gruppe landet
     (z.B. Verbrauchswerte getrennt von der Gesamtsumme). Nur die Gruppe
     als Ganzes springt ggf. auf die nächste Seite, nicht jede Zeile einzeln. */
  function kvRowHeight(value){
    const lines = doc.splitTextToSize(String(value), contentW - labelW);
    return Math.max(lines.length*4.4, 5.2) + 1.6;
  }
  function kvGroup(pairs){
    const visible = pairs.filter(([l,v])=>v);
    if(!visible.length) return;
    doc.setFontSize(9.5);
    const totalH = visible.reduce((sum,[l,v])=>sum + kvRowHeight(v), 0);
    checkSpace(totalH);
    visible.forEach(([l,v])=>kv(l,v));
  }
  function kvGroupWithTotal(pairs, totalPair){
    const visible = pairs.filter(([l,v])=>v);
    doc.setFontSize(9.5);
    let totalH = visible.reduce((sum,[l,v])=>sum + kvRowHeight(v), 0);
    if(totalPair && totalPair[1]) totalH += 11;
    if(totalH>0) checkSpace(totalH);
    visible.forEach(([l,v])=>kv(l,v));
    if(totalPair && totalPair[1]) totalRow(totalPair[0], totalPair[1]);
  }
  async function photoGrid(photos){
    photos = photos.filter(p=>p.url);
    if(!photos.length) return;
    y += 1;
    const gap = 6, colW = (contentW-gap)/2, maxH = 56, captionH = 6.5;
    for(let i=0;i<photos.length;i+=2){
      const pair = photos.slice(i,i+2);
      const row = [];
      for(const p of pair){
        const [oriented, publicUrl] = await Promise.all([orientedDataUrl(p.url), uploadedUrlFor(p.url)]);
        let w=colW, h=colW*0.68;
        try{
          const props = doc.getImageProperties(oriented);
          h = colW*(props.height/props.width);
          if(h>maxH){ h=maxH; w=maxH*(props.width/props.height); }
        }catch(e){}
        row.push(Object.assign({}, p, {w,h,oriented,publicUrl}));
      }
      const rowH = Math.max.apply(null, row.map(r=>r.h)) + captionH;
      checkSpace(rowH + 4);
      row.forEach((p, idx)=>{
        const x = marginX + idx*(colW+gap);
        try{
          doc.addImage(p.oriented, "JPEG", x, y, p.w, p.h);
          if(p.publicUrl) doc.link(x, y, p.w, p.h, {url: p.publicUrl});
        }catch(e){
          fillCol(PDF_PAPER); doc.rect(x, y, colW, maxH, "F");
          doc.setFontSize(8); col(PDF_RED);
          doc.text("Bild nicht ladbar", x+3, y+10);
        }
        drawCol(p.publicUrl ? PDF_BLUE : PDF_LINE); doc.setLineWidth(p.publicUrl ? 0.35 : 0.2);
        doc.rect(x, y, p.w, p.h);
        doc.setFontSize(7.6); doc.setFont(undefined, p.publicUrl ? "bold" : "normal");
        col(p.publicUrl ? PDF_BLUE_DEEP : PDF_INK_SOFT);
        doc.text(p.label + (p.publicUrl ? "  ·  antippen zum Öffnen" : ""), x, y + Math.max.apply(null,row.map(r=>r.h)) + 4.2);
      });
      y += rowH + 3;
    }
    col(PDF_INK);
  }
  async function sectionPhotos(color, title, kvPairs, photos){
    sectionHeader(title, color);
    kvGroup(kvPairs);
    await photoGrid(photos);
    y += 3;
  }
  function subheading(text){
    checkSpace(7);
    doc.setFontSize(8); doc.setFont(undefined,"bold"); col(PDF_BLUE_DEEP);
    doc.text(text.toUpperCase(), marginX, y+3.4);
    y += 6.5;
    col(PDF_INK);
  }
  async function roofSection(color, title, r){
    sectionHeader(title, color);
    kvGroup([
      ["Art", r.dachart],
      ["Eindeckung", r.dachaufbau],
      ["Regenrinne", [r.regenrinne, r.regenrinneMaterial].filter(Boolean).join(" – ")],
      ["Bemerkungen", r.bemerkung1]
    ]);
    const dachfotos = [
      {label:"Dachfoto 1", url:r.fotos[0]}, {label:"Dachfoto 2", url:r.fotos[1]},
      {label:"Dachfoto 3", url:r.fotos[2]}, {label:"Dachfoto 4", url:r.fotos[3]}, {label:"Dachfoto 5", url:r.fotos[4]},
      {label:"Dachfoto 6", url:r.drohnenFotos[0]}, {label:"Dachfoto 7", url:r.drohnenFotos[1]}, {label:"Dachfoto 8", url:r.drohnenFotos[2]}
    ];
    if(dachfotos.some(p=>p.url)){
      subheading("Dachfotos");
      await photoGrid(dachfotos);
    }
    kv("Kabelweg", r.dcLeitungsweg);
    await photoGrid([{label:"Kabelweg Bild 1", url:r.dcFotos[0]}, {label:"Kabelweg Bild 2", url:r.dcFotos[1]}]);
    kv("Wanddurchbrüche", r.wanddurchbrueche);
    await photoGrid([
      {label:"Wanddurchbruch 1", url:r.wanddurchbruecheFotos[0]},
      {label:"Wanddurchbruch 2", url:r.wanddurchbruecheFotos[1]},
      {label:"Wanddurchbruch 3", url:r.wanddurchbruecheFotos[2]}
    ]);
    kvGroup([
      ["Traufhöhe", r.traufe8],
      ["Gerüst erforderlich", r.geruest],
      ["Bemerkungen Gerüst", r.geruestBemerkung]
    ]);
    y += 3;
  }

  /* Titelblock */
  const logoH = 22, logoW = logoH / DWB_LOGO_RATIO;
  try{ doc.addImage(DWB_LOGO, "JPEG", marginX-2, 6, logoW, logoH); }catch(e){}
  doc.setFontSize(9); doc.setFont(undefined,"bold"); col(PDF_INK);
  doc.text("Besichtigt von " + (d.grunddaten.besichtigtVon||""), pageW-marginX, 11, {align:"right"});
  doc.setFont(undefined,"normal"); col(PDF_INK_SOFT);
  doc.text(formatDateDE(d.grunddaten.besichtigtAm) || "", pageW-marginX, 16.5, {align:"right"});
  doc.setFontSize(8.5);
  if(VERTRIEB_EMAIL) doc.text(VERTRIEB_EMAIL, pageW-marginX, 22, {align:"right"});
  if(BERATER_TELEFON) doc.text(BERATER_TELEFON, pageW-marginX, 27, {align:"right"});
  fillCol(PDF_BLUE); doc.rect(0,32,pageW,1.2,"F");
  doc.setFontSize(16); doc.setFont(undefined,"bold"); col(PDF_INK);
  doc.text("Bestandsaufnahme Protokoll", marginX, 43);
  y = 49;

  /* Info-Box Interessent/in / Standort */
  const boxH = 27;
  checkSpace(boxH+6);
  fillCol(PDF_PAPER); doc.roundedRect(marginX, y, contentW, boxH, 2.5, 2.5, "F");
  fillCol(PDF_BLUE); doc.roundedRect(marginX, y, 1.6, boxH, 0.8, 0.8, "F");
  const halfW = contentW/2;
  drawCol(PDF_LINE); doc.setLineWidth(0.25);
  doc.line(marginX+halfW, y+5, marginX+halfW, y+boxH-5);
  doc.setFontSize(8); doc.setFont(undefined,"bold"); col(PDF_BLUE_DEEP);
  doc.text("INTERESSENT/IN", marginX+7, y+7);
  doc.text("STANDORT", marginX+halfW+7, y+7);
  doc.setFontSize(9.5); doc.setFont(undefined,"normal"); col(PDF_INK);
  doc.text([d.kunde.anrede,custName].filter(Boolean).join(" ") || "–", marginX+7, y+13);
  doc.text(d.kunde.telefon || "", marginX+7, y+18.5);
  doc.text(d.kunde.email || "", marginX+7, y+24);
  doc.text([d.standort.strasse,d.standort.nr].filter(Boolean).join(" ") || "–", marginX+halfW+7, y+13);
  doc.text([d.standort.plz,d.standort.ort].filter(Boolean).join(" ") || "", marginX+halfW+7, y+18.5);
  y += boxH + 9;
  col(PDF_INK);

  /* DC */
  sectionHeader("DC", PDF_BLUE_DEEP);
  kvGroup([
    ["Kategorie", d.gebaeude.kategorie],
    ["Besonderheiten", d.gebaeude.besonderheiten]
  ]);
  y += 3;

  /* Dächer */
  for(let i=0;i<d.daecher.length;i++){
    await roofSection(PDF_BLUE_DEEP, `DACH ${i+1}`, d.daecher[i]);
  }

  /* Verbrauch */
  sectionHeader("VERBRAUCH", PDF_BLUE_DEEP);
  const gesamtverbrauch = [d.elektro.stromverbrauch, d.elektro.grossverbraucher.waermepumpe, d.elektro.grossverbraucher.eauto, d.elektro.grossverbraucher.sauna, d.elektro.grossverbraucher.pool]
    .map(v=>parseFloat(v)||0).reduce((a,b)=>a+b,0);
  kvGroupWithTotal([
    ["Hausstromverbrauch", d.elektro.stromverbrauch ? d.elektro.stromverbrauch+" kWh/Jahr" : ""],
    ["Wärmepumpe", d.elektro.grossverbraucher.waermepumpe ? d.elektro.grossverbraucher.waermepumpe+" kWh/Jahr" : ""],
    ["E-Auto", d.elektro.grossverbraucher.eauto ? d.elektro.grossverbraucher.eauto+" kWh/Jahr" : ""],
    ["Sauna", d.elektro.grossverbraucher.sauna ? d.elektro.grossverbraucher.sauna+" kWh/Jahr" : ""],
    ["Pool", d.elektro.grossverbraucher.pool ? d.elektro.grossverbraucher.pool+" kWh/Jahr" : ""]
  ], ["Gesamtverbrauch", gesamtverbrauch ? gesamtverbrauch.toLocaleString("de-DE")+" kWh/Jahr" : ""]);
  y += 3;

  /* AC – Zählerschrank */
  sectionHeader("AC – ZÄHLERSCHRANK", PDF_BLUE_DEEP);
  kv("Neuer Zählerschrank", d.elektro.zaehler.neuerZaehlerschrank);
  const zaehlerFotos = [
    {label:"Übersicht", url:d.elektro.zaehler.uebersicht},
    {label:"Ohne Abdeckungen", url:d.elektro.zaehler.ohneAbdeckungen},
    {label:"Typenschild", url:d.elektro.zaehler.typenschild},
    {label:"Vorsicherung/SLS", url:d.elektro.zaehler.vorsicherung},
    {label:"Anschlussbereich", url:d.elektro.zaehler.anschlussbereich},
    {label:"Verteilerfeld 1", url:d.elektro.zaehler.verteilerfeld1},
    {label:"Verteilerfeld 2", url:d.elektro.zaehler.verteilerfeld2}
  ];
  if(zaehlerFotos.some(p=>p.url)){
    subheading("Zählerschrank-Fotos");
    await photoGrid(zaehlerFotos);
  }
  kv("Weitere Unterverteilung", d.elektro.zaehler.weitereUV);
  await photoGrid([{label:"Weitere Unterverteilung", url:d.elektro.zaehler.weitereUVFoto}]);
  kv("Neue Unterverteilung", d.elektro.zaehler.neueUV);
  await photoGrid([{label:"Neue Unterverteilung", url:d.elektro.zaehler.neueUVFoto}]);
  kv("Wanddurchbrüche", d.elektro.zaehler.wanddurchbrueche);
  await photoGrid([
    {label:"Wanddurchbruch 1", url:d.elektro.zaehler.wanddurchbruecheFoto1},
    {label:"Wanddurchbruch 2", url:d.elektro.zaehler.wanddurchbruecheFoto2}
  ]);
  y += 3;

  /* Hausanschluss (Teil von AC) */
  sectionHeader("HAUSANSCHLUSS", PDF_BLUE_DEEP);
  kv("Hausanschluss", d.elektro.hausanschluss.typ);
  await photoGrid([{label:"Übersicht", url:d.elektro.hausanschluss.foto}]);
  kv("Potenzialausgleichsschiene", d.elektro.hausanschluss.potenzialausgleich);
  await photoGrid([{label:"Potenzialausgleichsschiene", url:d.elektro.hausanschluss.potenzialausgleichFoto}]);
  kv("Fundamenterder", d.elektro.hausanschluss.fundamenterder);
  await photoGrid([{label:"Fundamenterder", url:d.elektro.hausanschluss.fundamenterderFoto}]);
  kv("Bemerkungen", d.elektro.hausanschluss.bemerkung);
  y += 3;

  /* Wärmepumpe & Wallbox */
  sectionHeader("WÄRMEPUMPE & WALLBOX", PDF_BLUE_DEEP);
  kv("Wärmepumpe", d.elektro.waermepumpe);
  await photoGrid([
    {label:"Typenschild Wärmepumpe", url:d.elektro.fotoWPTypenschild},
    {label:"Wärmepumpenzähler", url:d.elektro.fotoWPZaehler}
  ]);
  kv("Wallbox", d.elektro.wallbox);
  await photoGrid([
    {label:"Wallbox Typenschild", url:d.elektro.fotoWallboxTypenschild},
    {label:"Wallbox Standortwunsch", url:d.elektro.fotoWallboxStandort}
  ]);
  kv("Durchbrüche notwendig", d.elektro.wallboxDurchbrueche);
  await photoGrid([{label:"Kabelweg/Durchbruch", url:d.elektro.fotoWallboxDurchbruch}]);
  y += 3;

  /* Hardware */
  const komp = Object.entries(d.elektro.komponenten||{}).filter(([k,v])=>v).map(([k])=>KOMP_LABELS[k]||k).join(", ");
  await sectionPhotos(PDF_BLUE_DEEP, "HARDWARE", [
    ["Komponenten", komp],
    ["Bemerkung", d.elektro.montageortBemerkung],
    ["Messkonzept", d.elektro.messkonzept]
  ], [
    {label:"Montageort Wechselrichter", url:d.elektro.fotoWechselrichter},
    {label:"Montageort Batteriespeicher", url:d.elektro.fotoSpeicher}
  ]);

  /* Weitere Fotos */
  const extra = (d.zusatzbilder||[]).map((f,i)=>({label:`Bild ${i+1}`, url:f})).filter(p=>p.url);
  if(extra.length){
    sectionHeader("WEITERE FOTOS", PDF_BLUE_DEEP);
    await photoGrid(extra);
  }

  /* Fußzeile auf allen Seiten */
  const totalPages = doc.internal.getNumberOfPages();
  for(let p=1;p<=totalPages;p++){
    doc.setPage(p);
    drawCol(PDF_LINE); doc.setLineWidth(0.25);
    doc.line(marginX, pageH-12, pageW-marginX, pageH-12);
    doc.setFontSize(8); col(PDF_INK_SOFT); doc.setFont(undefined,"normal");
    doc.text("Bestandsaufnahme Protokoll · DWB-Energie", marginX, pageH-8);
    doc.setFont(undefined,"bold"); col(PDF_BLUE_DEEP);
    doc.text(`Seite ${p} / ${totalPages}`, pageW-marginX, pageH-8, {align:"right"});
  }

  return doc;
}
function safeAlert(msg){ try{ alert(msg); }catch(e){ console.warn(msg); } }
async function triggerDownload(blob, filename){
  try{
    const file = new File([blob], filename, { type: blob.type || "application/octet-stream" });
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({ files: [file] });
      return;
    }
  }catch(e){
    if(e && e.name === "AbortError") return;
    console.warn("Teilen nicht möglich, falle zurück auf Download", e);
  }
  const url = URL.createObjectURL(blob);
  try{
    const a = document.createElement("a");
    a.href = url; a.download = filename; a.style.display = "none";
    document.body.appendChild(a);
    a.click();
    a.remove();
  }catch(e){ console.error(e); }
  showDownloadFallback(url, filename);
}
function showDownloadFallback(url, filename){
  let bar = document.getElementById("downloadFallbackBar");
  if(bar) bar.remove();
  bar = document.createElement("div");
  bar.id = "downloadFallbackBar";
  bar.style.cssText = "position:fixed;left:14px;right:14px;bottom:14px;z-index:200;background:var(--ink);color:#fff;padding:12px 14px;border-radius:var(--radius);display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;box-shadow:0 6px 18px rgba(22,58,87,.3);";
  const span = document.createElement("span");
  span.textContent = "Datei bereit: " + filename;
  span.style.cssText = "overflow:hidden;text-overflow:ellipsis;white-space:nowrap;";
  const link = document.createElement("a");
  link.href = url; link.download = filename; link.textContent = "Herunterladen";
  link.style.cssText = "background:var(--blue);color:#fff;padding:8px 12px;border-radius:var(--radius-sm);text-decoration:none;font-weight:700;flex-shrink:0;";
  const close = document.createElement("button");
  close.textContent = "\u2715";
  close.style.cssText = "background:none;border:none;color:#fff;font-size:16px;cursor:pointer;flex-shrink:0;";
  close.onclick = ()=> bar.remove();
  bar.appendChild(span); bar.appendChild(link); bar.appendChild(close);
  document.body.appendChild(bar);
}
async function downloadTextFallback(d){
  const blob = new Blob([buildTextSummary(d)], {type:"text/plain"});
  await triggerDownload(blob, pdfFilename(d).replace(".pdf",".txt"));
}
async function buildPDFSafe(d){
  try{
    if(!window.jspdf){
      safeAlert("PDF-Bibliothek konnte nicht geladen werden (keine Internetverbindung?). Es wird stattdessen eine Textdatei heruntergeladen.");
      await downloadTextFallback(d);
      return null;
    }
    return await buildPDF(d);
  }catch(e){
    console.error(e);
    safeAlert("PDF konnte nicht erstellt werden. Es wird stattdessen eine Textdatei heruntergeladen.");
    await downloadTextFallback(d);
    return null;
  }
}
async function downloadPDFOrFallback(d){
  const doc = await buildPDFSafe(d);
  if(!doc) return;
  try{
    await triggerDownload(doc.output("blob"), pdfFilename(d));
  }catch(e){
    console.error(e);
    await downloadTextFallback(d);
  }
}
function sendMail(){
  const to = [S.kunde.email, VERTRIEB_EMAIL, S.email.weitere].filter(Boolean).join(",");
  const subject = encodeURIComponent(S.email.betreff || defaultBetreff());
  const body = encodeURIComponent((S.email.nachricht || defaultNachricht()) + "\n\n---\n\nDas vollständige Protokoll als PDF ist im Download-Ordner (" + pdfFilename(S) + ") — bitte hier noch anhängen.\n\n" + buildTextSummary());
  window.location.href = `mailto:${to}?subject=${subject}&body=${body}`;
}
async function finishRecord(){
  const finishedData = S;
  const finishedId = currentRecordId;
  const rec = records.find(r=>r.id===currentRecordId);
  if(rec){ rec.status = "fertig"; rec.updatedAt = Date.now(); }
  await saveRecords();
  screen = "fertig"; S = null; currentRecordId = null;
  render();
  preparePDF(finishedId, finishedData);
}

/* ---------- Boot ---------- */
(async function boot(){
  records = await loadRecords();
  screen = "home";
  render();
})();
</script>
